<!doctype html>
<html lang="en">
  <head>
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qu-med Disposable — ISO 13485:2016 certified manufacturer of sterile medical disposables including IV cannulas, oxygen masks, ventilator circuits, and more. Based in Gurugram, Haryana, India." />
    <meta name="keywords" content="medical disposables, IV cannula, oxygen mask, ventilator circuit, medical devices manufacturer, Gurugram, Qu-med" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Qu-med Disposable — Medical Device Manufacturer, Gurugram</title>
    <style>
      /* Instant 0ms dark background & splash so hard refresh never flashes white */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07172E;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #07172E;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999999;
      }
      #initial-splash .splash-full-logo {
        max-width: 280px;
        width: 78vw;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 4px 20px rgba(0, 103, 255, 0.4));
      }
      @media (min-width: 769px) {
        #initial-splash .splash-full-logo {
          max-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant native splash: Only the logo in the dead center -->
      <div id="initial-splash">
        <img src="/images/White-Logo.png" alt="Qu-med Disposable" class="splash-full-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
